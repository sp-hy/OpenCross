; The Bestiary page's story numbers, orders and panels with [Game] OpenCrossMenu on in Arni: a field battle records its enemies, then the page
; by number, its places and traits panels on a beaten entry, and the name and area orders (see bestiary_order.txt). The save folder is a
; scratch one under tmp; a --config run never writes the collection file.
[Paths]
SaveDir=tmp\bestiary_order
[Game]
AutoSave=0
OpenCrossMenu=1
[Debug]
Room=alu_a01f
Panels=0
Seed=2
Script=tests/routes/bestiary_order.txt
ScriptSpeed=3
[Video]
VSync=0
Width=640
Height=480
ArtMode=hd
