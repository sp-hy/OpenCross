; Party swap route with KeepLineup: powershell -File tests\routes\run.ps1 party_swap_keep   (shots in tests\routes\shots)
; As party_swap, but the lineup the battle ended with stays the party (log: "session: party swap keeps the lineup").
[Paths]
SaveDir=tmp
[Debug]
Panels=0
Seed=2
Script=tests/routes/party_swap_keep.txt
ScriptSpeed=1
[Video]
VSync=0
ArtMode=hd
[Features]
PartySwap.Enabled=1
PartySwap.KeepLineup=1
