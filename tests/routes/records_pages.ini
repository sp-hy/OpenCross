; The record pages of the OpenCross row with [Game] OpenCrossMenu and RecordsHints=hints, on the mid-game file 05 of tmp\save.dat (see
; records_pages.txt). The save folder is a scratch copy (records_pages.prep.ps1); a --config run never writes the collection file.
[Paths]
SaveDir=tmp\records_pages
[Game]
AutoSave=0
OpenCrossMenu=1
RecordsHints=hints
[Debug]
Panels=0
Seed=2
Script=tests/routes/records_pages.txt
ScriptSpeed=3
[Video]
VSync=0
Width=640
Height=480
ArtMode=hd
